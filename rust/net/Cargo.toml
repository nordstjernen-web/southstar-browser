[package]
name = "southstar-net"
description = "Networking: fetching over rust/http, URLs, cookies, HSTS, the network log, error pages, about: pages, data: URLs, file: and FTP listings and view-source: documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-mime = { path = "../mime", version = "=1.0.6-dev" }
southstar-about-style = { path = "../about-style", version = "=1.0.6-dev" }
southstar-config = { path = "../config", version = "=1.0.6-dev" }
southstar-debuglog = { path = "../debuglog", version = "=1.0.6-dev" }
southstar-digest = { path = "../digest", version = "=1.0.6-dev" }
southstar-extensions = { path = "../extensions", version = "=1.0.6-dev" }
southstar-glib = { path = "../glib", version = "=1.0.6-dev" }
southstar-history = { path = "../history", version = "=1.0.6-dev" }
southstar-html-util = { path = "../html-util", version = "=1.0.6-dev" }
southstar-http = { path = "../http", version = "=1.0.6-dev" }
southstar-http-cache = { path = "../http-cache", version = "=1.0.6-dev" }
southstar-js-engine = { path = "../js-engine", version = "=1.0.6-dev", default-features = false }
southstar-netstore = { path = "../netstore", version = "=1.0.6-dev" }
southstar-netutil = { path = "../netutil", version = "=1.0.6-dev" }
southstar-sandbox = { path = "../sandbox", version = "=1.0.6-dev" }
southstar-url = { path = "../url", version = "=1.0.6-dev" }

[features]
avif = []
enchant = []
http-brotli = ["southstar-http/brotli"]
http-zstd = ["southstar-http/zstd"]
libav = []
poppler = []
seccomp = []
wasm = []
webgpu = []
woff2 = []

[lints]
workspace = true
