[package]
name = "southstar-net"
description = "Networking: fetching over rust/http, URLs, cookies, HSTS, the network log, error pages, about: pages, data: URLs, file: and FTP listings and view-source: documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-about-style = { path = "../about-style" }
southstar-config = { path = "../config" }
southstar-digest = { path = "../digest" }
southstar-glib = { path = "../glib" }
southstar-history = { path = "../history" }
southstar-html-util = { path = "../html-util" }
southstar-http = { path = "../http" }
southstar-http-cache = { path = "../http-cache" }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-netstore = { path = "../netstore" }
southstar-url = { path = "../url" }

[features]
avif = []
enchant = []
http-brotli = ["southstar-http/brotli"]
http-zstd = ["southstar-http/zstd"]
libav = []
ns-pango = []
poppler = []
seccomp = []
webgpu = []

[lints]
workspace = true
