[package]
name = "southstar-js-attrs"
description = "Attribute bindings: DOMTokenList, the dataset DOMStringMap, NamedNodeMap and Attr nodes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-runtime = { path = "../js-runtime", default-features = false }

[features]
default = ["quickjs"]
quickjs = ["southstar-js-engine/quickjs", "southstar-js-runtime/quickjs"]
boa = ["southstar-js-engine/boa", "southstar-js-runtime/boa"]

[lints]
workspace = true
