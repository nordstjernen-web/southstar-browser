[package]
name = "southstar-video"
description = "Inline <video> playback: the per-page video cache, frames advanced off the animation tick, autoplay, loop, mute and posters, click-to-play, WebVTT cues, MSE streams and the audio and video helper commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-av = { path = "../av", optional = true }
southstar-camera = { path = "../camera" }
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-image = { path = "../image" }
southstar-layout = { path = "../layout" }
southstar-layout-query = { path = "../layout-query" }
southstar-net = { path = "../net" }
southstar-plmpeg = { path = "../plmpeg" }
southstar-style = { path = "../style" }
southstar-texture = { path = "../texture" }
southstar-url = { path = "../url" }
southstar-webvtt = { path = "../webvtt" }

[features]
libav = ["dep:southstar-av"]

[lints]
workspace = true
