[package]
name = "southstar-video"
description = "Inline <video> playback: the per-page video cache, frames advanced off the animation tick, autoplay, loop, mute and posters, click-to-play, WebVTT cues, MSE streams and the audio and video helper commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-unicode = { path = "../unicode", version = "=1.0.8" }
southstar-av = { path = "../av", version = "=1.0.8", optional = true, features = ["scale"] }
southstar-camera = { path = "../camera", version = "=1.0.8" }
southstar-dom = { path = "../dom", version = "=1.0.8" }
southstar-glib = { path = "../glib", version = "=1.0.8" }
southstar-image = { path = "../image", version = "=1.0.8" }
southstar-layout = { path = "../layout", version = "=1.0.8" }
southstar-layout-query = { path = "../layout-query", version = "=1.0.8" }
southstar-net = { path = "../net", version = "=1.0.8" }
southstar-plmpeg = { path = "../plmpeg", version = "=1.0.8" }
southstar-style = { path = "../style", version = "=1.0.8" }
southstar-texture = { path = "../texture", version = "=1.0.8" }
southstar-url = { path = "../url", version = "=1.0.8" }
southstar-webvtt = { path = "../webvtt", version = "=1.0.8" }

[features]
libav = ["dep:southstar-av"]

[lints]
workspace = true
