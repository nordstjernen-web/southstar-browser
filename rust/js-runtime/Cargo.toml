[package]
name = "southstar-js-runtime"
description = "Creating and freeing a page's or a worker's JavaScript realm: the runtime and its interrupt handler, the window's and the worker global's installers in order, and the setup and teardown of every per-page state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-config = { path = "../config" }
southstar-csp = { path = "../csp" }
southstar-css = { path = "../css" }
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-js-bind = { path = "../js-bind", default-features = false }
southstar-js-brand = { path = "../js-brand" }
southstar-js-crypto = { path = "../js-crypto" }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-intl = { path = "../js-intl", default-features = false }
southstar-js-realm = { path = "../js-realm", default-features = false }
southstar-js-temporal = { path = "../js-temporal", default-features = false }
southstar-js-wasm = { path = "../js-wasm", optional = true }
southstar-layout = { path = "../layout" }
southstar-net = { path = "../net" }
southstar-url = { path = "../url" }

[features]
wasm = ["dep:southstar-js-wasm"]
webgpu = []
libav = []
audio-native-vorbis = []
audio-native-opus = []

[lints]
workspace = true
