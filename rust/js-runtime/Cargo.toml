[package]
name = "southstar-js-runtime"
description = "Creating and freeing a page's or a worker's JavaScript realm: the runtime and its interrupt handler, the window's and the worker global's installers in order, and the setup and teardown of every per-page state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-anim = { path = "../anim", version = "=1.0.6-dev" }
southstar-config = { path = "../config", version = "=1.0.6-dev" }
southstar-csp = { path = "../csp", version = "=1.0.6-dev" }
southstar-css = { path = "../css", version = "=1.0.6-dev" }
southstar-dom = { path = "../dom", version = "=1.0.6-dev" }
southstar-glib = { path = "../glib", version = "=1.0.6-dev" }
southstar-js-bind = { path = "../js-bind", version = "=1.0.6-dev", default-features = false }
southstar-js-brand = { path = "../js-brand", version = "=1.0.6-dev" }
southstar-js-crypto = { path = "../js-crypto", version = "=1.0.6-dev" }
southstar-js-engine = { path = "../js-engine", version = "=1.0.6-dev", default-features = false }
southstar-js-intl = { path = "../js-intl", version = "=1.0.6-dev", default-features = false }
southstar-js-realm = { path = "../js-realm", version = "=1.0.6-dev", default-features = false }
southstar-js-temporal = { path = "../js-temporal", version = "=1.0.6-dev", default-features = false }
southstar-js-wasm = { path = "../js-wasm", version = "=1.0.6-dev", optional = true }
southstar-layout = { path = "../layout", version = "=1.0.6-dev" }
southstar-net = { path = "../net", version = "=1.0.6-dev" }
southstar-url = { path = "../url", version = "=1.0.6-dev" }

[features]
wasm = ["dep:southstar-js-wasm"]
webgpu = []
libav = []
audio-native-vorbis = []
audio-native-opus = []

[lints]
workspace = true
