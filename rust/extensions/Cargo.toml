[package]
name = "southstar-extensions"
description = "WebExtensions: manifests, content scripts with their browser.* shim, declarativeNetRequest rules and Adblock filter lists"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-psl = { path = "../psl", version = "=1.0.10-dev" }
southstar-unicode = { path = "../unicode", version = "=1.0.10-dev" }
southstar-config = { path = "../config", version = "=1.0.10-dev" }
southstar-digest = { path = "../digest", version = "=1.0.10-dev" }
southstar-glib = { path = "../glib", version = "=1.0.10-dev" }
southstar-js-engine = { path = "../js-engine", version = "=1.0.10-dev", default-features = false }
regress = { package = "southstar-regress", path = "../../third_party/regress", version = "=1.0.10-dev" }

[lints]
workspace = true
