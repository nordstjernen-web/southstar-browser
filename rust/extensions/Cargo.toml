[package]
name = "southstar-extensions"
description = "WebExtensions: manifests, content scripts with their browser.* shim, declarativeNetRequest rules and Adblock filter lists"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-config = { path = "../config" }
southstar-glib = { path = "../glib" }
southstar-js-engine = { path = "../js-engine", default-features = false }

[features]
default = ["quickjs"]
quickjs = ["southstar-js-engine/quickjs"]
quickjs-original = ["quickjs", "southstar-js-engine/quickjs-original"]
boa = ["southstar-js-engine/boa"]

[lints]
workspace = true
