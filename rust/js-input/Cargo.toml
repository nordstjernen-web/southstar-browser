[package]
name = "southstar-js-input"
description = "Mouse, pointer, wheel, touch, clipboard and drag events from the shell, DataTransfer sessions and the WPT test-driver hooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-mime = { path = "../mime", version = "=1.0.5-dev" }
southstar-dom = { path = "../dom", version = "=1.0.5-dev" }
southstar-glib = { path = "../glib", version = "=1.0.5-dev" }
southstar-js-dispatch = { path = "../js-dispatch", version = "=1.0.5-dev" }
southstar-js-engine = { path = "../js-engine", version = "=1.0.5-dev", default-features = false }
southstar-js-events = { path = "../js-events", version = "=1.0.5-dev" }
southstar-js-focus = { path = "../js-focus", version = "=1.0.5-dev" }
southstar-js-frames = { path = "../js-frames", version = "=1.0.5-dev" }
southstar-js-geometry = { path = "../js-geometry", version = "=1.0.5-dev" }
southstar-js-perf = { path = "../js-perf", version = "=1.0.5-dev" }
southstar-js-runtime = { path = "../js-runtime", version = "=1.0.5-dev", default-features = false }
southstar-js-top-layer = { path = "../js-top-layer", version = "=1.0.5-dev" }
southstar-layout = { path = "../layout", version = "=1.0.5-dev" }

[lints]
workspace = true
