[package]
name = "southstar-webgl"
description = "WebGL 1 and 2: canvas.getContext('webgl'/'webgl2') mapped onto OpenGL ES through libepoxy, ported from webgl.c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-config = { path = "../config" }
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-canvas = { path = "../canvas", default-features = false }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-runtime = { path = "../js-runtime" }
southstar-url = { path = "../url" }

[lints]
workspace = true
