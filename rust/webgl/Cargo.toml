[package]
name = "southstar-webgl"
description = "WebGL 1 and 2: canvas.getContext('webgl'/'webgl2') mapped onto OpenGL ES through libepoxy, ported from webgl.c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-cairo = { path = "../cairo", version = "=1.0.6-dev" }
southstar-config = { path = "../config", version = "=1.0.6-dev" }
southstar-dom = { path = "../dom", version = "=1.0.6-dev" }
southstar-glctx = { path = "../glctx", version = "=1.0.6-dev" }
southstar-glib = { path = "../glib", version = "=1.0.6-dev" }
southstar-canvas = { path = "../canvas", version = "=1.0.6-dev", default-features = false }
southstar-js-engine = { path = "../js-engine", version = "=1.0.6-dev", default-features = false }
southstar-js-runtime = { path = "../js-runtime", version = "=1.0.6-dev" }
southstar-url = { path = "../url", version = "=1.0.6-dev" }

[lints]
workspace = true
