[package]
name = "southstar-js-elements"
description = "Element-specific HTML bindings: the table API, <img> state, labels and the small element getters and setters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-dom = { path = "../dom", version = "=1.0.6" }
southstar-glib = { path = "../glib", version = "=1.0.6" }
southstar-image = { path = "../image", version = "=1.0.6" }
southstar-js-collections = { path = "../js-collections", version = "=1.0.6" }
southstar-js-cssom = { path = "../js-cssom", version = "=1.0.6" }
southstar-js-document = { path = "../js-document", version = "=1.0.6" }
southstar-js-engine = { path = "../js-engine", version = "=1.0.6", default-features = false }
southstar-js-forms = { path = "../js-forms", version = "=1.0.6" }
southstar-js-frames = { path = "../js-frames", version = "=1.0.6" }
southstar-js-geometry = { path = "../js-geometry", version = "=1.0.6" }
southstar-js-images = { path = "../js-images", version = "=1.0.6" }
southstar-js-mutation = { path = "../js-mutation", version = "=1.0.6" }
southstar-js-reflect = { path = "../js-reflect", version = "=1.0.6" }
southstar-js-runtime = { path = "../js-runtime", version = "=1.0.6", default-features = false }
southstar-js-shadow = { path = "../js-shadow", version = "=1.0.6" }
southstar-layout = { path = "../layout", version = "=1.0.6" }
southstar-url = { path = "../url", version = "=1.0.6" }

[lints]
workspace = true
