[package]
name = "southstar-js-elements"
description = "Element-specific HTML bindings: the table API, <img> state, labels and the small element getters and setters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-image = { path = "../image" }
southstar-js-collections = { path = "../js-collections" }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-frames = { path = "../js-frames" }
southstar-js-images = { path = "../js-images" }
southstar-js-mutation = { path = "../js-mutation" }
southstar-js-reflect = { path = "../js-reflect" }
southstar-js-runtime = { path = "../js-runtime", default-features = false }
southstar-js-shadow = { path = "../js-shadow" }
southstar-url = { path = "../url" }

[lints]
workspace = true
