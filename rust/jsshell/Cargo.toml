[package]
name = "southstar-jsshell"
description = "A command-line JavaScript host over the engine-neutral layer, for running test262 and shell benchmarks on each engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "southstar-jsshell"
path = "src/main.rs"

[dependencies]
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-temporal = { path = "../js-temporal", default-features = false }

[features]
default = ["quickjs"]
quickjs = ["southstar-js-engine/quickjs", "southstar-js-temporal/quickjs"]
boa = ["southstar-js-engine/boa", "southstar-js-temporal/boa"]
boa-intl = ["southstar-js-engine/boa-intl"]

[lints]
workspace = true
