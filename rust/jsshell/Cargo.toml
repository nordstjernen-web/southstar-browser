[package]
name = "southstar-jsshell"
description = "A command-line JavaScript host over the engine-neutral layer, for running test262 and shell benchmarks on each engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "southstar-jsshell"
path = "src/main.rs"

[dependencies]
southstar-js-engine = { path = "../js-engine", version = "=1.0.5", default-features = false }
southstar-js-intl = { path = "../js-intl", version = "=1.0.5" }
southstar-js-temporal = { path = "../js-temporal", version = "=1.0.5", default-features = false }

[features]
boa-intl = ["southstar-js-engine/boa-intl"]

[lints]
workspace = true
