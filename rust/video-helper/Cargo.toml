[package]
name = "southstar-video-helper"
description = "The southstar-video helper process: decodes MSE video with libav and writes BGRA frames into a shared-memory ring the shell composites"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
southstar-av = { path = "../av" }
southstar-media-shm = { path = "../media-shm" }

[target.'cfg(target_os = "linux")'.dependencies]
southstar-helper-ffi = { path = "../helper-ffi" }

[features]
seccomp = ["southstar-helper-ffi/seccomp"]

[lints]
workspace = true
