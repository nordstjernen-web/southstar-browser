[package]
name = "southstar-video-helper"
description = "The southstar-video helper process: decodes MSE video with libav and writes BGRA frames into a shared-memory ring the shell composites"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
southstar-av = { path = "../av", version = "=1.0.5" }
southstar-media-shm = { path = "../media-shm", version = "=1.0.5" }

[target.'cfg(target_os = "linux")'.dependencies]
southstar-helper-ffi = { path = "../helper-ffi", version = "=1.0.5" }

[features]
rust-main = []
seccomp = ["southstar-helper-ffi/seccomp"]

[lints]
workspace = true
