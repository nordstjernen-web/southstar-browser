[package]
name = "southstar-js-window"
description = "The window's bindings: History, the Navigation API, Location, window.open, postMessage, session history, the browsing-context members and named access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-canvas = { path = "../canvas", version = "=1.0.6-dev" }
southstar-css = { path = "../css", version = "=1.0.6-dev" }
southstar-css-media = { path = "../css-media", version = "=1.0.6-dev" }
southstar-dom = { path = "../dom", version = "=1.0.6-dev" }
southstar-glib = { path = "../glib", version = "=1.0.6-dev" }
southstar-js-clone = { path = "../js-clone", version = "=1.0.6-dev" }
southstar-js-engine = { path = "../js-engine", version = "=1.0.6-dev", default-features = false }
southstar-js-frames = { path = "../js-frames", version = "=1.0.6-dev" }
southstar-js-geometry = { path = "../js-geometry", version = "=1.0.6-dev" }
southstar-js-net = { path = "../js-net", version = "=1.0.6-dev" }
southstar-js-perf = { path = "../js-perf", version = "=1.0.6-dev" }
southstar-js-runtime = { path = "../js-runtime", version = "=1.0.6-dev" }
southstar-js-services = { path = "../js-services", version = "=1.0.6-dev" }
southstar-layout-hit = { path = "../layout-hit", version = "=1.0.6-dev" }
southstar-unicode = { path = "../unicode", version = "=1.0.6-dev" }
southstar-url = { path = "../url", version = "=1.0.6-dev" }

[lints]
workspace = true
