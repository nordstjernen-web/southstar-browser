[package]
name = "southstar-js-cssom"
description = "The CSSOM bindings: getComputedStyle and its computed values, element.style, the CSS namespace and the Web Animations hooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-anim = { path = "../anim" }
southstar-css = { path = "../css" }
southstar-css-media = { path = "../css-media" }
southstar-css-prop-syntax = { path = "../css-prop-syntax" }
southstar-dom = { path = "../dom" }
southstar-engine = { path = "../engine" }
southstar-glib = { path = "../glib" }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-runtime = { path = "../js-runtime", default-features = false }
southstar-layout = { path = "../layout" }
southstar-layout-grid = { path = "../layout-grid" }
southstar-mat4 = { path = "../mat4" }
southstar-numfmt = { path = "../numfmt" }
southstar-paint = { path = "../paint" }
southstar-selector-text = { path = "../selector-text" }
southstar-style = { path = "../style" }
southstar-url = { path = "../url" }

[lints]
workspace = true
