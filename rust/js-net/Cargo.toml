[package]
name = "southstar-js-net"
description = "The networking bindings: fetch, Request, Response, AbortController, XMLHttpRequest, WebSocket and EventSource"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-glib = { path = "../glib" }
southstar-js-bind = { path = "../js-bind", default-features = false }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-runtime = { path = "../js-runtime" }

[features]
default = ["quickjs"]
quickjs = ["southstar-js-engine/quickjs", "southstar-js-bind/quickjs"]
boa = ["southstar-js-engine/boa", "southstar-js-bind/boa"]

[lints]
workspace = true
