southstar-js-images = { path = "../js-images", version = "=1.0.5" }
southstar-js-mutation = { path = "../js-mutation", version = "=1.0.5" }
southstar-js-runtime = { path = "../js-runtime", version = "=1.0.5", default-features = false }
southstar-js-services = { path = "../js-services", version = "=1.0.5" }
southstar-js-top-layer = { path = "../js-top-layer", version = "=1.0.5" }
