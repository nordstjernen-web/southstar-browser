[package]
name = "southstar-font"
description = "The @font-face web font loader: fetching, WOFF and WOFF2 conversion, the on-disk cache and fontconfig registration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-digest = { path = "../digest", version = "=1.0.5-dev" }
southstar-glib = { path = "../glib", version = "=1.0.5-dev" }
southstar-net = { path = "../net", version = "=1.0.5-dev" }
southstar-text = { path = "../text", version = "=1.0.5-dev" }
southstar-url = { path = "../url", version = "=1.0.5-dev" }
southstar-woff2 = { path = "../woff2", version = "=1.0.5-dev", optional = true }

[features]
fontconfig = []
woff2 = ["dep:southstar-woff2"]

[lints]
workspace = true
