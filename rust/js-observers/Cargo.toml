[package]
name = "southstar-js-observers"
description = "MutationObserver, IntersectionObserver and ResizeObserver: each page's observers, the records they queue and the ticks that deliver them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-js-engine = { path = "../js-engine", default-features = false, features = ["quickjs"] }
southstar-layout = { path = "../layout" }

[features]
quickjs-original = ["southstar-js-engine/quickjs-original"]

[lints]
workspace = true
