[package]
name = "southstar-js-observers"
description = "MutationObserver, IntersectionObserver and ResizeObserver: each page's observers, the records they queue and the ticks that deliver them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-css = { path = "../css", version = "=1.0.5" }
southstar-dom = { path = "../dom", version = "=1.0.5" }
southstar-glib = { path = "../glib", version = "=1.0.5" }
southstar-js-engine = { path = "../js-engine", version = "=1.0.5", default-features = false }
southstar-js-geometry = { path = "../js-geometry", version = "=1.0.5" }
southstar-js-perf = { path = "../js-perf", version = "=1.0.5" }
southstar-js-runtime = { path = "../js-runtime", version = "=1.0.5", default-features = false }
southstar-layout = { path = "../layout", version = "=1.0.5" }
southstar-numfmt = { path = "../numfmt", version = "=1.0.5" }
southstar-style = { path = "../style", version = "=1.0.5" }

