southstar-glib = { path = "../glib" }
southstar-image = { path = "../image" }
southstar-layout = { path = "../layout" }
southstar-layout-content = { path = "../layout-content" }
southstar-layout-float = { path = "../layout-float" }
southstar-layout-geom = { path = "../layout-geom" }
southstar-layout-query = { path = "../layout-query" }
southstar-layout-tree = { path = "../layout-tree" }
southstar-net = { path = "../net" }
southstar-numfmt = { path = "../numfmt" }
southstar-paint = { path = "../paint" }
southstar-style = { path = "../style" }
southstar-svg = { path = "../svg" }
southstar-url = { path = "../url" }

