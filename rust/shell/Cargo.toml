[package]
name = "southstar-shell"
description = "The static library meson links into the GTK shell: its ported files plus every module southstar-ffi carries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
southstar-unicode = { path = "../unicode" }
southstar-bookmarks = { path = "../bookmarks" }
southstar-browser = { path = "../browser" }
southstar-bytecode-cache = { path = "../bytecode-cache" }
southstar-cairo = { path = "../cairo" }
southstar-config = { path = "../config" }
southstar-debuglog = { path = "../debuglog" }
southstar-dom = { path = "../dom" }
southstar-engine = { path = "../engine" }
southstar-ffi = { path = "../southstar-ffi" }
southstar-font = { path = "../font" }
southstar-glib = { path = "../glib" }
southstar-gtk-ffi = { path = "../gtk-ffi" }
southstar-headless = { path = "../headless" }
southstar-history = { path = "../history" }
southstar-html-parser = { path = "../html-parser" }
southstar-http-cache = { path = "../http-cache" }
southstar-i18n = { path = "../i18n" }
southstar-media-shm = { path = "../media-shm" }
southstar-net = { path = "../net" }
southstar-netutil = { path = "../netutil" }
southstar-paint = { path = "../paint" }
southstar-renderer-client = { path = "../renderer-client" }
southstar-renderer-host = { path = "../renderer-host" }
southstar-sandbox = { path = "../sandbox" }
southstar-spellcheck = { path = "../spellcheck" }
southstar-svg = { path = "../svg" }
southstar-text = { path = "../text" }
southstar-threaddump = { path = "../threaddump" }
southstar-url = { path = "../url" }
southstar-watchdog = { path = "../watchdog" }

[features]
avif = ["southstar-ffi/avif"]
sdl = ["southstar-ffi/sdl"]
fontconfig = ["southstar-ffi/fontconfig"]
font-fontconfig = ["southstar-ffi/font-fontconfig"]
poppler = ["southstar-ffi/poppler"]
egl = ["southstar-ffi/egl"]
thai = ["southstar-ffi/thai"]
rust-shaper = ["southstar-ffi/rust-shaper"]
enchant = ["southstar-ffi/enchant"]
http-brotli = ["southstar-ffi/http-brotli"]
http-zstd = ["southstar-ffi/http-zstd"]
libav = ["southstar-ffi/libav"]
audio-native-vorbis = ["southstar-ffi/audio-native-vorbis"]
audio-native-opus = ["southstar-ffi/audio-native-opus"]
seccomp = ["southstar-ffi/seccomp"]
wasm = ["southstar-ffi/wasm"]
webgpu = ["southstar-ffi/webgpu"]
woff2 = ["southstar-ffi/woff2"]

[lints]
workspace = true
