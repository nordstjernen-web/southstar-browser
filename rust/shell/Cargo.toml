[package]
name = "southstar-shell"
description = "The GTK shell: the browser window, tabs, toolbar, menus and the process that drives the renderers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
southstar-unicode = { path = "../unicode", version = "=1.0.9" }
southstar-bookmarks = { path = "../bookmarks", version = "=1.0.9" }
southstar-browser = { path = "../browser", version = "=1.0.9" }
southstar-bytecode-cache = { path = "../bytecode-cache", version = "=1.0.9" }
southstar-cairo = { path = "../cairo", version = "=1.0.9" }
southstar-config = { path = "../config", version = "=1.0.9" }
southstar-debuglog = { path = "../debuglog", version = "=1.0.9" }
southstar-dom = { path = "../dom", version = "=1.0.9" }
southstar-engine = { path = "../engine", version = "=1.0.9" }
southstar-ffi = { path = "../southstar-ffi", version = "=1.0.9" }
southstar-font = { path = "../font", version = "=1.0.9" }
southstar-glib = { path = "../glib", version = "=1.0.9" }
southstar-gtk = { path = "../gtk", version = "=1.0.9" }
southstar-gtk-ffi = { path = "../gtk-ffi", version = "=1.0.9" }
southstar-headless = { path = "../headless", version = "=1.0.9" }
southstar-history = { path = "../history", version = "=1.0.9" }
southstar-html-parser = { path = "../html-parser", version = "=1.0.9" }
southstar-http-cache = { path = "../http-cache", version = "=1.0.9" }
southstar-i18n = { path = "../i18n", version = "=1.0.9" }
southstar-mcp = { path = "../mcp", version = "=1.0.9" }
southstar-media-shm = { path = "../media-shm", version = "=1.0.9" }
southstar-net = { path = "../net", version = "=1.0.9" }
southstar-netutil = { path = "../netutil", version = "=1.0.9" }
southstar-paint = { path = "../paint", version = "=1.0.9" }
southstar-renderer-client = { path = "../renderer-client", version = "=1.0.9" }
southstar-renderer-host = { path = "../renderer-host", version = "=1.0.9" }
southstar-sandbox = { path = "../sandbox", version = "=1.0.9" }
southstar-spellcheck = { path = "../spellcheck", version = "=1.0.9" }
southstar-svg = { path = "../svg", version = "=1.0.9" }
southstar-text = { path = "../text", version = "=1.0.9" }
southstar-threaddump = { path = "../threaddump", version = "=1.0.9" }
southstar-url = { path = "../url", version = "=1.0.9" }
southstar-watchdog = { path = "../watchdog", version = "=1.0.9" }

[features]
avif = ["southstar-ffi/avif"]
sdl = ["southstar-ffi/sdl"]
fontconfig = ["southstar-ffi/fontconfig"]
font-fontconfig = ["southstar-ffi/font-fontconfig"]
poppler = ["southstar-ffi/poppler"]
egl = ["southstar-ffi/egl"]
rust-shaper = ["southstar-ffi/rust-shaper"]
enchant = ["southstar-ffi/enchant"]
http-brotli = ["southstar-ffi/http-brotli"]
http-zstd = ["southstar-ffi/http-zstd"]
libav = ["southstar-ffi/libav"]
audio-native-vorbis = ["southstar-ffi/audio-native-vorbis"]
audio-native-opus = ["southstar-ffi/audio-native-opus"]
seccomp = ["southstar-ffi/seccomp"]
wasm = ["southstar-ffi/wasm"]
webgpu = ["southstar-ffi/webgpu"]
woff2 = ["southstar-ffi/woff2"]

[lints]
workspace = true
