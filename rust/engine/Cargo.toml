[package]
name = "southstar-engine"
description = "The synchronous page pipeline shared by the drivers: fetches, style sheet collection, cascade and relayout, captures to PNG and PDF, print sheets and dumps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-anim = { path = "../anim", version = "=1.0.6" }
southstar-cairo = { path = "../cairo", version = "=1.0.6" }
southstar-css = { path = "../css", version = "=1.0.6" }
southstar-css-media = { path = "../css-media", version = "=1.0.6" }
southstar-css-syntax = { path = "../css-syntax", version = "=1.0.6" }
southstar-debuglog = { path = "../debuglog", version = "=1.0.6" }
southstar-dom = { path = "../dom", version = "=1.0.6" }
southstar-glib = { path = "../glib", version = "=1.0.6" }
southstar-image = { path = "../image", version = "=1.0.6" }
southstar-js-runtime = { path = "../js-runtime", version = "=1.0.6", default-features = false }
southstar-layout = { path = "../layout", version = "=1.0.6" }
southstar-layout-query = { path = "../layout-query", version = "=1.0.6" }
southstar-net = { path = "../net", version = "=1.0.6" }
southstar-paint = { path = "../paint", version = "=1.0.6" }
southstar-print = { path = "../print", version = "=1.0.6" }
southstar-render = { path = "../render", version = "=1.0.6" }
southstar-url = { path = "../url", version = "=1.0.6" }

[lints]
workspace = true
