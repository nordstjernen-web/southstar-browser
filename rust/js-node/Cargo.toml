[package]
name = "southstar-js-node"
description = "Node bindings: tree mutation and pre-insertion validity, tree getters, compareDocumentPosition, isEqualNode, node names and the attribute methods"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-css = { path = "../css", version = "=1.0.6-dev" }
southstar-dom = { path = "../dom", version = "=1.0.6-dev" }
southstar-glib = { path = "../glib", version = "=1.0.6-dev" }
southstar-js-attrs = { path = "../js-attrs", version = "=1.0.6-dev" }
southstar-js-collections = { path = "../js-collections", version = "=1.0.6-dev" }
southstar-js-custom-elements = { path = "../js-custom-elements", version = "=1.0.6-dev" }
southstar-js-dispatch = { path = "../js-dispatch", version = "=1.0.6-dev" }
southstar-js-document = { path = "../js-document", version = "=1.0.6-dev" }
southstar-js-dom-factory = { path = "../js-dom-factory", version = "=1.0.6-dev" }
southstar-js-engine = { path = "../js-engine", version = "=1.0.6-dev", default-features = false }
southstar-js-events = { path = "../js-events", version = "=1.0.6-dev" }
southstar-js-forms = { path = "../js-forms", version = "=1.0.6-dev" }
