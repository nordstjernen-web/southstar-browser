[package]
name = "southstar-js-node"
description = "Node bindings: tree mutation and pre-insertion validity, tree getters, compareDocumentPosition, isEqualNode, node names and the attribute methods"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-css = { path = "../css" }
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-js-custom-elements = { path = "../js-custom-elements" }
southstar-js-dispatch = { path = "../js-dispatch" }
southstar-js-document = { path = "../js-document" }
southstar-js-dom-factory = { path = "../js-dom-factory" }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-frames = { path = "../js-frames" }
southstar-js-images = { path = "../js-images" }
southstar-js-loader = { path = "../js-loader" }
southstar-js-mutation = { path = "../js-mutation" }
southstar-js-runtime = { path = "../js-runtime", default-features = false }
southstar-js-top-layer = { path = "../js-top-layer" }
southstar-js-traversal = { path = "../js-traversal" }

[lints]
workspace = true
