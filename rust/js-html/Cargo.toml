[package]
name = "southstar-js-html"
description = "HTML fragment parsing and serialization bindings: innerHTML, outerHTML, getHTML, setHTMLUnsafe, insertAdjacent*, textContent and microdata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-html-parser = { path = "../html-parser" }
southstar-js-custom-elements = { path = "../js-custom-elements" }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-loader = { path = "../js-loader" }
southstar-js-mutation = { path = "../js-mutation" }
southstar-js-runtime = { path = "../js-runtime", default-features = false }
southstar-js-shadow = { path = "../js-shadow" }
southstar-url = { path = "../url" }

[lints]
workspace = true
