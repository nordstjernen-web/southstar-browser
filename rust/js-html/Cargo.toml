[package]
name = "southstar-js-html"
description = "HTML fragment parsing and serialization bindings: innerHTML, outerHTML, getHTML, setHTMLUnsafe, insertAdjacent*, textContent and microdata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-unicode = { path = "../unicode", version = "=1.0.8" }
southstar-dom = { path = "../dom", version = "=1.0.8" }
southstar-glib = { path = "../glib", version = "=1.0.8" }
southstar-html-parser = { path = "../html-parser", version = "=1.0.8" }
southstar-js-attrs = { path = "../js-attrs", version = "=1.0.8" }
southstar-js-collections = { path = "../js-collections", version = "=1.0.8" }
southstar-js-custom-elements = { path = "../js-custom-elements", version = "=1.0.8" }
southstar-js-elements = { path = "../js-elements", version = "=1.0.8" }
southstar-js-engine = { path = "../js-engine", version = "=1.0.8", default-features = false }
southstar-js-loader = { path = "../js-loader", version = "=1.0.8" }
southstar-js-mutation = { path = "../js-mutation", version = "=1.0.8" }
southstar-js-runtime = { path = "../js-runtime", version = "=1.0.8", default-features = false }
southstar-js-shadow = { path = "../js-shadow", version = "=1.0.8" }
southstar-url = { path = "../url", version = "=1.0.8" }

[lints]
workspace = true
