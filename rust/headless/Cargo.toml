[package]
name = "southstar-headless"
description = "The headless driver behind --headless: renderer-driven and in-process runs, scripted input, captures, WPT reporting and layout inspection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
libav = []

[dependencies]
southstar-anim = { path = "../anim" }
southstar-config = { path = "../config" }
southstar-css = { path = "../css" }
southstar-css-media = { path = "../css-media" }
southstar-debuglog = { path = "../debuglog" }
southstar-digest = { path = "../digest" }
southstar-dom = { path = "../dom" }
southstar-forms = { path = "../forms" }
southstar-engine = { path = "../engine" }
southstar-glib = { path = "../glib" }
southstar-html-parser = { path = "../html-parser" }
southstar-html-util = { path = "../html-util" }
southstar-image = { path = "../image" }
southstar-js-dispatch = { path = "../js-dispatch" }
southstar-js-focus = { path = "../js-focus" }
southstar-js-forms = { path = "../js-forms" }
southstar-js-input = { path = "../js-input" }
southstar-js-lifecycle = { path = "../js-lifecycle" }
southstar-js-loader = { path = "../js-loader" }
southstar-js-page = { path = "../js-page" }
southstar-js-runtime = { path = "../js-runtime", default-features = false }
southstar-js-top-layer = { path = "../js-top-layer" }
southstar-js-window = { path = "../js-window" }
southstar-layout = { path = "../layout" }
southstar-layout-hit = { path = "../layout-hit" }
southstar-layout-query = { path = "../layout-query" }
southstar-net = { path = "../net" }
southstar-numfmt = { path = "../numfmt" }
southstar-paint = { path = "../paint" }
southstar-renderer-client = { path = "../renderer-client" }
southstar-renderer-host = { path = "../renderer-host" }
southstar-url = { path = "../url" }
southstar-video = { path = "../video" }

[lints]
workspace = true
