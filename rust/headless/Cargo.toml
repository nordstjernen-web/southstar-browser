[package]
name = "southstar-headless"
description = "The headless driver behind --headless: renderer-driven and in-process runs, scripted input, captures, WPT reporting and layout inspection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
libav = []

[dependencies]
southstar-anim = { path = "../anim", version = "=1.0.5" }
southstar-config = { path = "../config", version = "=1.0.5" }
southstar-css = { path = "../css", version = "=1.0.5" }
southstar-css-media = { path = "../css-media", version = "=1.0.5" }
southstar-debuglog = { path = "../debuglog", version = "=1.0.5" }
southstar-digest = { path = "../digest", version = "=1.0.5" }
southstar-dom = { path = "../dom", version = "=1.0.5" }
southstar-forms = { path = "../forms", version = "=1.0.5" }
southstar-engine = { path = "../engine", version = "=1.0.5" }
southstar-glib = { path = "../glib", version = "=1.0.5" }
southstar-html-parser = { path = "../html-parser", version = "=1.0.5" }
southstar-html-util = { path = "../html-util", version = "=1.0.5" }
southstar-image = { path = "../image", version = "=1.0.5" }
southstar-js-dispatch = { path = "../js-dispatch", version = "=1.0.5" }
southstar-js-focus = { path = "../js-focus", version = "=1.0.5" }
southstar-js-forms = { path = "../js-forms", version = "=1.0.5" }
southstar-js-input = { path = "../js-input", version = "=1.0.5" }
southstar-js-lifecycle = { path = "../js-lifecycle", version = "=1.0.5" }
southstar-js-loader = { path = "../js-loader", version = "=1.0.5" }
southstar-js-media = { path = "../js-media", version = "=1.0.5" }
southstar-js-page = { path = "../js-page", version = "=1.0.5" }
southstar-js-runtime = { path = "../js-runtime", version = "=1.0.5", default-features = false }
southstar-js-top-layer = { path = "../js-top-layer", version = "=1.0.5" }
southstar-js-window = { path = "../js-window", version = "=1.0.5" }
southstar-layout = { path = "../layout", version = "=1.0.5" }
southstar-layout-hit = { path = "../layout-hit", version = "=1.0.5" }
southstar-layout-query = { path = "../layout-query", version = "=1.0.5" }
southstar-net = { path = "../net", version = "=1.0.5" }
southstar-numfmt = { path = "../numfmt", version = "=1.0.5" }
southstar-paint = { path = "../paint", version = "=1.0.5" }
southstar-renderer-client = { path = "../renderer-client", version = "=1.0.5" }
southstar-renderer-host = { path = "../renderer-host", version = "=1.0.5" }
southstar-style = { path = "../style", version = "=1.0.5" }
southstar-url = { path = "../url", version = "=1.0.5" }
southstar-video = { path = "../video", version = "=1.0.5" }

[lints]
workspace = true
