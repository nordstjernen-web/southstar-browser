[package]
name = "southstar-headless"
description = "The headless driver behind --headless: renderer-driven and in-process runs, scripted input, captures, WPT reporting and layout inspection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
libav = []

[dependencies]
southstar-anim = { path = "../anim" }
southstar-config = { path = "../config" }
southstar-css = { path = "../css" }
southstar-css-media = { path = "../css-media" }
southstar-digest = { path = "../digest" }
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-html-parser = { path = "../html-parser" }
southstar-html-util = { path = "../html-util" }
southstar-image = { path = "../image" }
southstar-layout = { path = "../layout" }
southstar-layout-query = { path = "../layout-query" }
southstar-numfmt = { path = "../numfmt" }
southstar-renderer-client = { path = "../renderer-client" }
southstar-renderer-host = { path = "../renderer-host" }
southstar-url = { path = "../url" }
southstar-video = { path = "../video" }

[lints]
workspace = true
