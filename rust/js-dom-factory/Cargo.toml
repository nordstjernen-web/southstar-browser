[package]
name = "southstar-js-dom-factory"
description = "Document factories, the window node constructors, DOMParser, CloseWatcher, DOMImplementation, importNode/adoptNode/cloneNode, name validation, namespace lookups and the hyperlink URL-part accessors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-dom = { path = "../dom", version = "=1.0.5-dev" }
southstar-glib = { path = "../glib", version = "=1.0.5-dev" }
southstar-html-parser = { path = "../html-parser", version = "=1.0.5-dev" }
southstar-js-custom-elements = { path = "../js-custom-elements", version = "=1.0.5-dev" }
southstar-js-dispatch = { path = "../js-dispatch", version = "=1.0.5-dev" }
southstar-js-document = { path = "../js-document", version = "=1.0.5-dev" }
southstar-js-engine = { path = "../js-engine", version = "=1.0.5-dev", default-features = false }
southstar-js-events = { path = "../js-events", version = "=1.0.5-dev" }
southstar-js-mutation = { path = "../js-mutation", version = "=1.0.5-dev" }
southstar-js-reflect = { path = "../js-reflect", version = "=1.0.5-dev" }
southstar-js-runtime = { path = "../js-runtime", version = "=1.0.5-dev", default-features = false }
southstar-url = { path = "../url", version = "=1.0.5-dev" }
southstar-xml = { path = "../xml", version = "=1.0.5-dev" }

[lints]
workspace = true
