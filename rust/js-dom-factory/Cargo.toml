[package]
name = "southstar-js-dom-factory"
description = "Document factories, the window node constructors, DOMParser, CloseWatcher, DOMImplementation, importNode/adoptNode/cloneNode, name validation, namespace lookups and the hyperlink URL-part accessors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-html-parser = { path = "../html-parser" }
southstar-js-custom-elements = { path = "../js-custom-elements" }
southstar-js-document = { path = "../js-document" }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-mutation = { path = "../js-mutation" }
southstar-js-runtime = { path = "../js-runtime", default-features = false }
southstar-url = { path = "../url" }
southstar-xml = { path = "../xml" }

[lints]
workspace = true
