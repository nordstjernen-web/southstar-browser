[package]
name = "southstar-js-mutation"
description = "DOM change recording: the id, class, tag and past-names bookkeeping of child list and attribute changes, the recorded attribute setters, the orphan set, the pending change event and the NamedNodeMap cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-css = { path = "../css", version = "=1.0.5" }
southstar-dom = { path = "../dom", version = "=1.0.5" }
southstar-glib = { path = "../glib", version = "=1.0.5" }
southstar-js-collections = { path = "../js-collections", version = "=1.0.5" }
southstar-js-custom-elements = { path = "../js-custom-elements", version = "=1.0.5" }
southstar-js-engine = { path = "../js-engine", version = "=1.0.5", default-features = false }
southstar-js-images = { path = "../js-images", version = "=1.0.5" }
southstar-js-loader = { path = "../js-loader", version = "=1.0.5" }
southstar-js-observers = { path = "../js-observers", version = "=1.0.5" }
southstar-js-runtime = { path = "../js-runtime", version = "=1.0.5", default-features = false }

[lints]
workspace = true
