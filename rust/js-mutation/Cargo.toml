[package]
name = "southstar-js-mutation"
description = "DOM change recording: the id, class, tag and past-names bookkeeping of child list and attribute changes, the recorded attribute setters, the orphan set, the pending change event and the NamedNodeMap cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-css = { path = "../css" }
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-js-collections = { path = "../js-collections" }
southstar-js-custom-elements = { path = "../js-custom-elements" }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-images = { path = "../js-images" }
southstar-js-loader = { path = "../js-loader" }
southstar-js-runtime = { path = "../js-runtime", default-features = false }

[lints]
workspace = true
