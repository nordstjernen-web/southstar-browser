[package]
name = "southstar-js-mutation"
description = "DOM change recording: the id, class, tag and past-names bookkeeping of child list and attribute changes, the recorded attribute setters, the orphan set, the pending change event and the NamedNodeMap cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-runtime = { path = "../js-runtime" }

[features]
default = ["quickjs"]
quickjs = ["southstar-js-engine/quickjs"]
boa = ["southstar-js-engine/boa"]

[lints]
workspace = true
