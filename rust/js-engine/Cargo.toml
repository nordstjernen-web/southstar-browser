[package]
name = "southstar-js-engine"
description = "The engine-neutral JavaScript layer: the API the bindings use, over the in-tree Boa fork"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
boa_engine = { package = "southstar-boa-engine", path = "../../third_party/boa_engine", version = "=1.0.5-dev", features = ["annex-b", "experimental"] }
boa_gc = { package = "southstar-boa-gc", path = "../../third_party/boa_gc", version = "=1.0.5-dev" }
serde_json = "1"

[features]
boa-intl = ["boa_engine/intl_bundled"]

[lints]
workspace = true
