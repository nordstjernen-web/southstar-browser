[package]
name = "southstar-js-storage"
description = "Web Storage: localStorage and sessionStorage, their persistence, quota and partitioning, and the storage event fan-out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-config = { path = "../config" }
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-runtime = { path = "../js-runtime" }

[features]
default = ["quickjs"]
quickjs = ["southstar-js-engine/quickjs"]
boa = ["southstar-js-engine/boa"]

[lints]
workspace = true
