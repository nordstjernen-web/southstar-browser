[package]
name = "southstar-webgpu"
description = "Experimental WebGPU: navigator.gpu over the external wgpu-native library, ported from webgpu.c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-cairo = { path = "../cairo", version = "=1.0.5" }
southstar-dom = { path = "../dom", version = "=1.0.5" }
southstar-glib = { path = "../glib", version = "=1.0.5" }
southstar-canvas = { path = "../canvas", version = "=1.0.5", default-features = false, features = ["webgpu"] }
southstar-js-engine = { path = "../js-engine", version = "=1.0.5", default-features = false }
southstar-js-runtime = { path = "../js-runtime", version = "=1.0.5", features = ["webgpu"] }

[lints]
workspace = true
