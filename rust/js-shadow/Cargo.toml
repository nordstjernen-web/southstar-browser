[package]
name = "southstar-js-shadow"
description = "Shadow DOM and slots: attachShadow, the ShadowRoot wrapper, slot assignment, assignedSlot and getRootNode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-runtime = { path = "../js-runtime", default-features = false }

[features]
default = ["quickjs"]
quickjs = ["southstar-js-engine/quickjs", "southstar-js-runtime/quickjs"]
boa = ["southstar-js-engine/boa", "southstar-js-runtime/boa"]

[lints]
workspace = true
