<!doctype html>
<!-- Southstar — the page a PDF document gets in a build without the pdf.js viewer: its name and a download link. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>{{TITLE}}</title>
<style>
:root { color-scheme: light dark; }
body { margin: 0; padding: 80px 16px; text-align: center; font: 15px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
p { margin: 0 0 8px; }
</style>
</head>
<body>
<p>{{NAME}}</p>
<p>PDF viewer unavailable — <a href="{{URL}}" download="{{NAME}}">download</a></p>
</body>
</html>
