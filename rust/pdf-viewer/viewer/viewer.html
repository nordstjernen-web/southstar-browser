<!doctype html>
<!-- Southstar — the PDF viewer page; rust/pdf-viewer fills in the document, its name and its bytes. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="pdfjs-version" content="{{PDFJS_VERSION}}">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="{{BASE}}viewer/viewer.css">
<script type="module" src="{{BASE}}viewer/viewer.mjs"></script>
</head>
<body>
<div id="toolbar">
<div class="group">
<button id="prev" type="button" title="Previous page">&#9650;</button>
<button id="next" type="button" title="Next page">&#9660;</button>
<input id="page" type="text" inputmode="numeric" size="4" value="1" title="Page"> <span>of <span id="count">0</span></span>
</div>
<div class="group">
<button id="zoom-out" type="button" title="Zoom out">&minus;</button>
<select id="zoom" title="Zoom">
<option value="auto" selected>Automatic</option>
<option value="page-fit">Page fit</option>
<option value="0.5">50%</option>
<option value="0.75">75%</option>
<option value="1">100%</option>
<option value="1.25">125%</option>
<option value="1.5">150%</option>
<option value="2">200%</option>
<option value="3">300%</option>
<option value="4">400%</option>
<option value="custom" hidden></option>
</select>
<button id="zoom-in" type="button" title="Zoom in">+</button>
</div>
<div class="spacer"></div>
<div class="group">
<input id="find" type="search" placeholder="Find in document" title="Find (Enter: next, Shift+Enter: previous)">
<span id="find-status"></span>
</div>
<a class="download" href="{{URL}}" download="{{NAME}}" title="Download">Download</a>
</div>
<div id="pages"></div>
<div id="status" hidden></div>
{{DATA}}
</body>
</html>
