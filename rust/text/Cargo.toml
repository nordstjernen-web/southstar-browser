[package]
name = "southstar-text"
description = "Text layout in Rust, ported from web-text-lib (a Pango fork): attributes, line breaking, itemization, fontconfig fonts, HarfBuzz shaping, paragraph layout and cairo rendering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "LGPL-2.0-or-later"
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
rust-shaper = ["dep:harfrust", "dep:png", "dep:read-fonts", "dep:skrifa"]
thai = []

[dependencies]
southstar-bidi = { path = "../bidi", version = "=1.0.5" }
southstar-cairo = { path = "../cairo", version = "=1.0.5" }
southstar-unicode = { path = "../unicode", version = "=1.0.5" }
harfrust = { version = "0.15", optional = true, default-features = false, features = ["std"] }
png = { version = "0.18", optional = true, default-features = false }
read-fonts = { version = "0.46", optional = true, default-features = false, features = ["std"] }
skrifa = { version = "0.49", optional = true }

[lints]
workspace = true
