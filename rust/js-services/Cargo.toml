[package]
name = "southstar-js-services"
description = "The window-level services: timers, navigator and its sub-objects, the camera and microphone helpers, the window console, screen, matchMedia, Notification, queueMicrotask, ClipboardItem and the WebRTC stubs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-config = { path = "../config" }
southstar-css-media = { path = "../css-media" }
southstar-glib = { path = "../glib" }
southstar-js-bind = { path = "../js-bind", default-features = false }
southstar-js-engine = { path = "../js-engine", default-features = false }

[lints]
workspace = true
