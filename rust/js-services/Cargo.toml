[package]
name = "southstar-js-services"
description = "The window-level services: timers, navigator and its sub-objects, the camera and microphone helpers, the window console, screen, matchMedia, Notification, queueMicrotask, ClipboardItem and the WebRTC stubs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-camera = { path = "../camera", version = "=1.0.5" }
southstar-config = { path = "../config", version = "=1.0.5" }
southstar-css-media = { path = "../css-media", version = "=1.0.5" }
southstar-dom = { path = "../dom", version = "=1.0.5" }
southstar-glib = { path = "../glib", version = "=1.0.5" }
southstar-js-bind = { path = "../js-bind", version = "=1.0.5", default-features = false }
southstar-js-engine = { path = "../js-engine", version = "=1.0.5", default-features = false }
southstar-js-net = { path = "../js-net", version = "=1.0.5" }
southstar-js-runtime = { path = "../js-runtime", version = "=1.0.5", default-features = false }
southstar-mic = { path = "../mic", version = "=1.0.5" }
southstar-net = { path = "../net", version = "=1.0.5" }
southstar-netutil = { path = "../netutil", version = "=1.0.5" }

[lints]
workspace = true
