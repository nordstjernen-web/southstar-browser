[package]
name = "southstar-js-forms"
description = "The forms bindings: form-control values, selection, checkedness, select options, labels, FormData, constraint validation, submission and ElementInternals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-mime = { path = "../mime", version = "=1.0.6-dev" }
southstar-css = { path = "../css", version = "=1.0.6-dev" }
southstar-datetime = { path = "../datetime", version = "=1.0.6-dev" }
southstar-dom = { path = "../dom", version = "=1.0.6-dev" }
southstar-glib = { path = "../glib", version = "=1.0.6-dev" }
southstar-html-util = { path = "../html-util", version = "=1.0.6-dev" }
southstar-js-bind = { path = "../js-bind", version = "=1.0.6-dev", default-features = false }
southstar-js-collections = { path = "../js-collections", version = "=1.0.6-dev" }
southstar-js-engine = { path = "../js-engine", version = "=1.0.6-dev", default-features = false }
southstar-js-frames = { path = "../js-frames", version = "=1.0.6-dev" }
southstar-js-mutation = { path = "../js-mutation", version = "=1.0.6-dev" }
southstar-js-net = { path = "../js-net", version = "=1.0.6-dev" }
southstar-js-runtime = { path = "../js-runtime", version = "=1.0.6-dev", default-features = false }
southstar-js-url = { path = "../js-url", version = "=1.0.6-dev" }
southstar-net = { path = "../net", version = "=1.0.6-dev" }
southstar-numfmt = { path = "../numfmt", version = "=1.0.6-dev" }
southstar-unicode = { path = "../unicode", version = "=1.0.6-dev" }
southstar-url = { path = "../url", version = "=1.0.6-dev" }

