[package]
name = "southstar-js-forms"
description = "The forms bindings: form-control values, selection, checkedness, select options, labels, FormData, constraint validation, submission and ElementInternals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-css = { path = "../css" }
southstar-datetime = { path = "../datetime" }
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-html-util = { path = "../html-util" }
southstar-js-bind = { path = "../js-bind", default-features = false }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-mutation = { path = "../js-mutation" }
southstar-js-runtime = { path = "../js-runtime", default-features = false }
southstar-numfmt = { path = "../numfmt" }
southstar-url = { path = "../url" }

[lints]
workspace = true
