[package]
name = "southstar-js-forms"
description = "The forms bindings: FormData, constraint validation, form submission and reset, and SubmitEvent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-js-engine = { path = "../js-engine", default-features = false, features = ["quickjs"] }

[features]
quickjs-original = ["southstar-js-engine/quickjs-original"]

[lints]
workspace = true
