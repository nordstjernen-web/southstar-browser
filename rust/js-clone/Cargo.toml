[package]
name = "southstar-js-clone"
description = "Structured cloning of JavaScript values within a realm, and the wire graph worker messages travel in between runtimes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-js-bind = { path = "../js-bind", default-features = false }
southstar-js-engine = { path = "../js-engine", default-features = false }

[features]
default = ["quickjs"]
quickjs = ["southstar-js-bind/quickjs", "southstar-js-engine/quickjs"]
boa = ["southstar-js-bind/boa", "southstar-js-engine/boa"]

[lints]
workspace = true
