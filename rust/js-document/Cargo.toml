[package]
name = "southstar-js-document"
description = "Document bindings: cookie, title, dir, body and head, the legacy colours, readyState, referrer, compatMode, the element getters, document.open/write/close and realm documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-csp = { path = "../csp" }
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-html-parser = { path = "../html-parser" }
southstar-js-custom-elements = { path = "../js-custom-elements" }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-mutation = { path = "../js-mutation" }
southstar-js-runtime = { path = "../js-runtime", default-features = false }
southstar-js-traversal = { path = "../js-traversal" }
southstar-net = { path = "../net" }
southstar-url = { path = "../url" }

[lints]
workspace = true
