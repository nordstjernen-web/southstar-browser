[package]
name = "southstar-js-document"
description = "Document bindings: cookie, title, dir, body and head, the legacy colours, readyState, referrer, compatMode, the element getters, document.open/write/close and realm documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-csp = { path = "../csp", version = "=1.0.5" }
southstar-dom = { path = "../dom", version = "=1.0.5" }
southstar-glib = { path = "../glib", version = "=1.0.5" }
southstar-html-parser = { path = "../html-parser", version = "=1.0.5" }
southstar-js-collections = { path = "../js-collections", version = "=1.0.5" }
southstar-js-custom-elements = { path = "../js-custom-elements", version = "=1.0.5" }
southstar-js-engine = { path = "../js-engine", version = "=1.0.5", default-features = false }
southstar-js-events = { path = "../js-events", version = "=1.0.5" }
southstar-js-focus = { path = "../js-focus", version = "=1.0.5" }
southstar-js-frames = { path = "../js-frames", version = "=1.0.5" }
southstar-js-loader = { path = "../js-loader", version = "=1.0.5" }
southstar-js-mutation = { path = "../js-mutation", version = "=1.0.5" }
southstar-js-runtime = { path = "../js-runtime", version = "=1.0.5", default-features = false }
southstar-js-traversal = { path = "../js-traversal", version = "=1.0.5" }
southstar-js-window = { path = "../js-window", version = "=1.0.5" }
southstar-net = { path = "../net", version = "=1.0.5" }
southstar-url = { path = "../url", version = "=1.0.5" }

[lints]
workspace = true
