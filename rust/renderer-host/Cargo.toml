[package]
name = "southstar-renderer-host"
description = "The renderer side of the renderer protocol: painting a page into shared-memory tiles and viewport layers for the window's compositor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-browser = { path = "../browser", version = "=1.0.5-dev" }
southstar-cairo = { path = "../cairo", version = "=1.0.5-dev" }
southstar-glib = { path = "../glib", version = "=1.0.5-dev" }
southstar-image = { path = "../image", version = "=1.0.5-dev" }
southstar-ipc = { path = "../ipc", version = "=1.0.5-dev" }
southstar-net = { path = "../net", version = "=1.0.5-dev" }
southstar-renderer-client = { path = "../renderer-client", version = "=1.0.5-dev" }
southstar-threaddump = { path = "../threaddump", version = "=1.0.5-dev" }
southstar-url = { path = "../url", version = "=1.0.5-dev" }

[features]
sdl = []
fontconfig = []

