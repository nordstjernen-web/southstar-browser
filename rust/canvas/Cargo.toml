[package]
name = "southstar-canvas"
description = "The canvas 2D API: colours, filters and lengths, ported from js_canvas.c and js_canvas_api.c section by section"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-cairo = { path = "../cairo", version = "=1.0.5" }
southstar-css = { path = "../css", version = "=1.0.5" }
southstar-digest = { path = "../digest", version = "=1.0.5" }
southstar-dom = { path = "../dom", version = "=1.0.5" }
southstar-glib = { path = "../glib", version = "=1.0.5" }
southstar-image = { path = "../image", version = "=1.0.5" }
southstar-js-engine = { path = "../js-engine", version = "=1.0.5", default-features = false }
southstar-js-images = { path = "../js-images", version = "=1.0.5" }
southstar-js-runtime = { path = "../js-runtime", version = "=1.0.5" }
southstar-layout = { path = "../layout", version = "=1.0.5" }
southstar-numfmt = { path = "../numfmt", version = "=1.0.5" }
southstar-text = { path = "../text", version = "=1.0.5" }
southstar-texture = { path = "../texture", version = "=1.0.5" }
southstar-video = { path = "../video", version = "=1.0.5" }

[features]
webgpu = []

[lints]
workspace = true
