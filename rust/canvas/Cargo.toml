[package]
name = "southstar-canvas"
description = "The canvas 2D API: colours, filters and lengths, ported from js_canvas.c and js_canvas_api.c section by section"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-image = { path = "../image" }
southstar-js-engine = { path = "../js-engine", default-features = false, features = ["quickjs"] }
southstar-layout = { path = "../layout" }

[features]
ns-pango = []
webgpu = []

[lints]
workspace = true
