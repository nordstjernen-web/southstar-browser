[package]
name = "southstar-canvas"
description = "The canvas 2D API: colours, filters and lengths, ported from js_canvas.c and js_canvas_api.c section by section"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-cairo = { path = "../cairo" }
southstar-css = { path = "../css" }
southstar-digest = { path = "../digest" }
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-image = { path = "../image" }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-images = { path = "../js-images" }
southstar-js-runtime = { path = "../js-runtime" }
southstar-layout = { path = "../layout" }
southstar-numfmt = { path = "../numfmt" }
southstar-text = { path = "../text" }
southstar-texture = { path = "../texture" }
southstar-video = { path = "../video" }

[features]
webgpu = []

[lints]
workspace = true
