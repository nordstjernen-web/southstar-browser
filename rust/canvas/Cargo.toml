[package]
name = "southstar-canvas"
description = "The canvas 2D API: colours, filters and lengths, ported from js_canvas.c and js_canvas_api.c section by section"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-glib = { path = "../glib" }
southstar-js-engine = { path = "../js-engine", default-features = false, features = ["quickjs"] }

[features]
quickjs-original = ["southstar-js-engine/quickjs-original"]

[lints]
workspace = true
