[package]
name = "southstar-helper-ffi"
description = "The static library the media helper processes link: the sandbox and media downloads over rust/http, so they stay small and need none of the engine's libraries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
southstar-http = { path = "../http", version = "=1.0.8" }
southstar-sandbox = { path = "../sandbox", version = "=1.0.8" }

[features]
seccomp = ["southstar-sandbox/seccomp"]

[lints]
workspace = true
