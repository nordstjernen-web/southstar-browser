southstar-engine = { path = "../engine", version = "=1.0.9" }
southstar-glib = { path = "../glib", version = "=1.0.9" }
southstar-idb = { path = "../idb", version = "=1.0.9" }
southstar-js-attrs = { path = "../js-attrs", version = "=1.0.9" }
southstar-js-bind = { path = "../js-bind", version = "=1.0.9", default-features = false }
southstar-js-brand = { path = "../js-brand", version = "=1.0.9" }
southstar-js-clone = { path = "../js-clone", version = "=1.0.9" }
southstar-js-collections = { path = "../js-collections", version = "=1.0.9" }
southstar-js-compression = { path = "../js-compression", version = "=1.0.9" }
