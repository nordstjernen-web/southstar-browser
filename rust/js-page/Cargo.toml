[package]
name = "southstar-js-page"
description = "Installing a parsed document into the page's realm: resetting the runtime state, the document object, the window globals and interfaces, then running the document's scripts; and the page's JavaScript statistics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-canvas = { path = "../canvas", version = "=1.0.9" }
southstar-css = { path = "../css", version = "=1.0.9" }
southstar-debuglog = { path = "../debuglog", version = "=1.0.9" }
