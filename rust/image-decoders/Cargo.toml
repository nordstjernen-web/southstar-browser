[package]
name = "southstar-image-decoders"
description = "Image decoders: PNG/APNG, GIF, JPEG and BMP through southstar-raster, ICO/CUR containers, and WebP (still and animated) over libwebp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-av = { path = "../av", optional = true }
southstar-glib = { path = "../glib" }
southstar-raster = { path = "../raster" }
southstar-texture = { path = "../texture" }

[features]
avif = ["dep:southstar-av"]

[lints]
workspace = true
