[package]
name = "southstar-js-media"
description = "The media bindings: HTMLMediaElement, canPlayType, mediaCapabilities, the MSE natives, VTTCue and textTracks, AudioContext, OfflineAudioContext, their AudioNodes, AudioParams and AudioBuffers, and the EME entry points"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-unicode = { path = "../unicode", version = "=1.0.9" }
southstar-dom = { path = "../dom", version = "=1.0.9" }
southstar-js-dispatch = { path = "../js-dispatch", version = "=1.0.9" }
southstar-js-bind = { path = "../js-bind", version = "=1.0.9", default-features = false }
southstar-js-engine = { path = "../js-engine", version = "=1.0.9", default-features = false }
southstar-js-events = { path = "../js-events", version = "=1.0.9" }
southstar-js-perf = { path = "../js-perf", version = "=1.0.9" }
southstar-js-runtime = { path = "../js-runtime", version = "=1.0.9", default-features = false }
southstar-js-services = { path = "../js-services", version = "=1.0.9" }
southstar-mic = { path = "../mic", version = "=1.0.9" }
southstar-url = { path = "../url", version = "=1.0.9" }
southstar-video = { path = "../video", version = "=1.0.9" }
southstar-webaudio = { path = "../webaudio", version = "=1.0.9" }

[lints]
workspace = true
