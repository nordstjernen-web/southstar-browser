[package]
name = "southstar-js-media"
description = "The media bindings: HTMLMediaElement, canPlayType, mediaCapabilities, the MSE natives, VTTCue and textTracks, AudioContext, OfflineAudioContext, their AudioNodes, AudioParams and AudioBuffers, and the EME entry points"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-runtime = { path = "../js-runtime" }
southstar-webaudio = { path = "../webaudio" }

[features]
default = ["quickjs"]
quickjs = ["southstar-js-engine/quickjs"]
boa = ["southstar-js-engine/boa"]

[lints]
workspace = true
