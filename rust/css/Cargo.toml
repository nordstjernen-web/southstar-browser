[package]
name = "southstar-css"
description = "css.c ported by section: colours, lengths and calc(), container queries, gradients, positions, image values, transforms, grid and font values, shadows, animations and transitions, display, counters and lists, border-image, the property table, the per-property value parser, shorthand expansion, the inline style text behind element.style, value serialization and interpolation, declaration blocks and their validity checks, the selector parser, nesting and @supports, the style sheet parser with its at-rules, shadow-tree style scoping, presentational hints, the element state behind pseudo-classes, attr() substitution, selector matching, var() substitution, the custom-property cascade and registered-property values, gathering matching rules, computed-style queries, resolving pending declarations, applying matched declarations, computed-style unit resolution, computed grid track text, cascade layer order, the rule index, restyle invalidation, and the text helpers the style engine shares"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-css-syntax = { path = "../css-syntax" }
