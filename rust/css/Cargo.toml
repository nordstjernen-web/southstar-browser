[package]
name = "southstar-css"
description = "The style engine, ported from css.c: colours, lengths and calc(), container queries, gradients, positions, image values, transforms, grid and font values, shadows, animations and transitions, var() in @keyframes stops, display, counters and lists, border-image, the property table, the per-property value parser, shorthand expansion, the inline style text behind element.style, value serialization and interpolation, declaration blocks and their validity checks, the selector parser, nesting and @supports, the style sheet parser with its at-rules, shadow-tree style scoping, presentational hints, the element state behind pseudo-classes, attr() substitution, selector matching, var() substitution, the custom-property cascade, the registered-property registry and registered-property values, the user-agent style sheet, the style sheet caches and <style> element text, gathering matching rules, style sharing, value, style and sheet lifetimes, computed-style fixups, the cascade walk and incremental restyle, computed-style queries, resolving pending declarations, applying matched declarations, computed-style unit resolution, computed grid track text, cascade layer order, the rule index, restyle invalidation, and the text helpers the style engine shares"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-unicode = { path = "../unicode", version = "=1.0.6-dev" }
southstar-css-color = { path = "../css-color", version = "=1.0.6-dev" }
southstar-css-grammar = { path = "../css-grammar", version = "=1.0.6-dev" }
southstar-css-media = { path = "../css-media", version = "=1.0.6-dev" }
southstar-css-prop-syntax = { path = "../css-prop-syntax", version = "=1.0.6-dev" }
southstar-css-syntax = { path = "../css-syntax", version = "=1.0.6-dev" }
southstar-dom = { path = "../dom", version = "=1.0.6-dev" }
southstar-glib = { path = "../glib", version = "=1.0.6-dev" }
southstar-mat4 = { path = "../mat4", version = "=1.0.6-dev" }
southstar-numfmt = { path = "../numfmt", version = "=1.0.6-dev" }
southstar-selector-text = { path = "../selector-text", version = "=1.0.6-dev" }
southstar-url = { path = "../url", version = "=1.0.6-dev" }
regress = "0.12.0"

[features]
avif = []

[lints]
workspace = true
