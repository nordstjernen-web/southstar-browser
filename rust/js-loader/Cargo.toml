[package]
name = "southstar-js-loader"
description = "Script, module and stylesheet loading: classic and module script scheduling with the parser-blocking, deferred and async lists, the parser hold, import maps, module resolution and fetching, script fetching with nosniff, CSP and integrity checks, load and error events on script and link, stylesheet link loading, the bytecode cache over compiled scripts and modules, import attributes and import.meta, and the script profiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-bytecode-cache = { path = "../bytecode-cache", version = "=1.0.6-dev" }
southstar-csp = { path = "../csp", version = "=1.0.6-dev" }
southstar-dom = { path = "../dom", version = "=1.0.6-dev" }
southstar-engine = { path = "../engine", version = "=1.0.6-dev" }
southstar-extensions = { path = "../extensions", version = "=1.0.6-dev", default-features = false }
southstar-glib = { path = "../glib", version = "=1.0.6-dev" }
southstar-js-custom-elements = { path = "../js-custom-elements", version = "=1.0.6-dev" }
southstar-js-engine = { path = "../js-engine", version = "=1.0.6-dev", default-features = false }
southstar-js-images = { path = "../js-images", version = "=1.0.6-dev" }
southstar-js-runtime = { path = "../js-runtime", version = "=1.0.6-dev", default-features = false }
southstar-js-url = { path = "../js-url", version = "=1.0.6-dev" }
southstar-net = { path = "../net", version = "=1.0.6-dev" }
southstar-sandbox = { path = "../sandbox", version = "=1.0.6-dev" }
southstar-url = { path = "../url", version = "=1.0.6-dev" }

[lints]
workspace = true
