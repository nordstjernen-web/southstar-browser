[package]
name = "southstar-js-url"
description = "URL, URLSearchParams, atob/btoa, TextEncoder/TextDecoder, object URLs with the blob: URL registry, and FileReader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-glib = { path = "../glib" }
southstar-js-bind = { path = "../js-bind", default-features = false }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-runtime = { path = "../js-runtime", default-features = false }

[features]
default = ["quickjs"]
quickjs = [
    "southstar-js-engine/quickjs",
    "southstar-js-bind/quickjs",
    "southstar-js-runtime/quickjs",
]
boa = ["southstar-js-engine/boa", "southstar-js-bind/boa", "southstar-js-runtime/boa"]

[lints]
workspace = true
