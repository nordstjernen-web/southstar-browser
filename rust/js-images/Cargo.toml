[package]
name = "southstar-js-images"
description = "Image readiness for script: each page's tracked <img> loads through the image cache, their load and error events, the image a node shows, and the rescans when a document's base URL changes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-dom = { path = "../dom", version = "=1.0.5-dev" }
southstar-glib = { path = "../glib", version = "=1.0.5-dev" }
southstar-image = { path = "../image", version = "=1.0.5-dev" }
southstar-js-engine = { path = "../js-engine", version = "=1.0.5-dev", default-features = false }
southstar-js-perf = { path = "../js-perf", version = "=1.0.5-dev" }
southstar-js-runtime = { path = "../js-runtime", version = "=1.0.5-dev", default-features = false }
southstar-layout = { path = "../layout", version = "=1.0.5-dev" }
southstar-net = { path = "../net", version = "=1.0.5-dev" }
southstar-url = { path = "../url", version = "=1.0.5-dev" }

[lints]
workspace = true
