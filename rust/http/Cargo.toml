[package]
name = "southstar-http"
description = "The HTTP client: HTTP/1.1 and HTTP/2 (with its own framing and HPACK) over TLS, pooled multiplexed connections and content decoding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
southstar-http-wire = { path = "../http-wire", version = "=1.0.5-dev" }
ml-kem = { version = "0.3.2", default-features = false, features = ["zeroize"] }
ring = { version = "0.17.14", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
zeroize = { version = "1.8", default-features = false }

[features]
brotli = []
zstd = []

[lints]
workspace = true
