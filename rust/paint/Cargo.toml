[package]
name = "southstar-paint"
description = "Painting the layout box tree with cairo and southstar-text: the walk with stacking, clips, transforms and 3D, box decorations, replaced content, masks, inline text, list markers, page text setup and the viewport layer planner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

