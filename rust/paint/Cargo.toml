[package]
name = "southstar-paint"
description = "Painting the layout box tree with cairo and ns-pango: the walk with stacking, clips, transforms and 3D, box decorations, replaced content, masks, inline text, list markers, page text setup and the viewport layer planner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-anim = { path = "../anim" }
southstar-cairo = { path = "../cairo" }
southstar-css = { path = "../css" }
southstar-dom = { path = "../dom" }
southstar-font = { path = "../font" }
southstar-glib = { path = "../glib" }
southstar-image = { path = "../image" }
southstar-layout = { path = "../layout" }
southstar-layout-geom = { path = "../layout-geom" }
southstar-mat4 = { path = "../mat4" }
southstar-numfmt = { path = "../numfmt" }
southstar-selection = { path = "../selection" }
southstar-style = { path = "../style" }
southstar-texture = { path = "../texture" }

[features]
ns-pango = []

[lints]
workspace = true
