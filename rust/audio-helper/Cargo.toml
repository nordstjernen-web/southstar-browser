[package]
name = "southstar-audio-helper"
description = "The southstar-audio helper process: decodes MPEG-1/MP2, MP3, WebM and Ogg audio, mixes and resamples it and plays it through SDL2, driven by line commands from the shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
southstar-av = { path = "../av", version = "=1.0.5-dev" }
southstar-glib = { path = "../glib", version = "=1.0.5-dev" }
southstar-helper-ffi = { path = "../helper-ffi", version = "=1.0.5-dev" }
southstar-http = { path = "../http", version = "=1.0.5-dev" }
southstar-media-shm = { path = "../media-shm", version = "=1.0.5-dev" }
southstar-minimp3 = { path = "../minimp3", version = "=1.0.5-dev" }
southstar-plmpeg = { path = "../plmpeg", version = "=1.0.5-dev" }

[features]
rust-main = []
libav = []
vorbisfile = []
opusfile = []
seccomp = ["southstar-helper-ffi/seccomp"]

[build-dependencies]
southstar-build = { path = "../build", version = "=1.0.5-dev" }

[lints]
workspace = true
