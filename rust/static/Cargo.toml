[package]
name = "southstar-static"
description = "The static library meson links into the C targets other than the GTK shell: southstar-ffi as a staticlib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
southstar-ffi = { path = "../southstar-ffi", version = "=1.0.6-dev" }

[features]
avif = ["southstar-ffi/avif"]
sdl = ["southstar-ffi/sdl"]
fontconfig = ["southstar-ffi/fontconfig"]
font-fontconfig = ["southstar-ffi/font-fontconfig"]
poppler = ["southstar-ffi/poppler"]
egl = ["southstar-ffi/egl"]
thai = ["southstar-ffi/thai"]
rust-shaper = ["southstar-ffi/rust-shaper"]
enchant = ["southstar-ffi/enchant"]
http-brotli = ["southstar-ffi/http-brotli"]
http-zstd = ["southstar-ffi/http-zstd"]
libav = ["southstar-ffi/libav"]
audio-native-vorbis = ["southstar-ffi/audio-native-vorbis"]
audio-native-opus = ["southstar-ffi/audio-native-opus"]
seccomp = ["southstar-ffi/seccomp"]
wasm = ["southstar-ffi/wasm"]
webgpu = ["southstar-ffi/webgpu"]
woff2 = ["southstar-ffi/woff2"]

[lints]
workspace = true
