[package]
name = "southstar-js-geometry"
description = "CSSOM View geometry and scrolling: getBoundingClientRect and getClientRects, the offset, client and scroll metrics, element and window scrolling with scrollIntoView, elementFromPoint and elementsFromPoint, and the SVG geometry behind getBBox, getCTM, getScreenCTM and path lengths"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-css = { path = "../css" }
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-runtime = { path = "../js-runtime", default-features = false }
southstar-layout = { path = "../layout" }
southstar-mat4 = { path = "../mat4" }
southstar-style = { path = "../style" }
southstar-svg = { path = "../svg" }

[lints]
workspace = true
