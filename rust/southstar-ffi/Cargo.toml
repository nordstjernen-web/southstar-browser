[package]
name = "southstar-ffi"
description = "The static library meson links into the C targets: every module ported to Rust, behind its C ABI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
southstar-about-style = { path = "../about-style" }
southstar-anim = { path = "../anim" }
southstar-bookmarks = { path = "../bookmarks" }
southstar-browser = { path = "../browser" }
southstar-bytecode-cache = { path = "../bytecode-cache" }
southstar-camera = { path = "../camera" }
southstar-canvas = { path = "../canvas" }
southstar-config = { path = "../config" }
southstar-csp = { path = "../csp" }
southstar-css = { path = "../css" }
southstar-css-media = { path = "../css-media" }
southstar-css-prop-syntax = { path = "../css-prop-syntax" }
southstar-css-syntax = { path = "../css-syntax" }
southstar-datetime = { path = "../datetime" }
southstar-debuglog = { path = "../debuglog" }
southstar-eventsource = { path = "../eventsource" }
southstar-extensions = { path = "../extensions" }
southstar-font = { path = "../font" }
southstar-forms = { path = "../forms" }
southstar-glctx = { path = "../glctx" }
southstar-glib = { path = "../glib" }
southstar-history = { path = "../history" }
southstar-html-parser = { path = "../html-parser" }
southstar-html-util = { path = "../html-util" }
southstar-http-cache = { path = "../http-cache" }
southstar-image-decoders = { path = "../image-decoders" }
southstar-ipc = { path = "../ipc" }
southstar-js-attrs = { path = "../js-attrs" }
southstar-js-brand = { path = "../js-brand" }
southstar-js-clone = { path = "../js-clone" }
southstar-js-collections = { path = "../js-collections" }
southstar-js-crypto = { path = "../js-crypto" }
southstar-js-cssom = { path = "../js-cssom" }
southstar-js-custom-elements = { path = "../js-custom-elements" }
southstar-js-document = { path = "../js-document" }
southstar-js-events = { path = "../js-events" }
southstar-js-forms = { path = "../js-forms" }
southstar-js-geometry = { path = "../js-geometry" }
southstar-js-intl = { path = "../js-intl" }
southstar-js-media = { path = "../js-media" }
southstar-js-net = { path = "../js-net" }
southstar-js-node = { path = "../js-node" }
southstar-js-observers = { path = "../js-observers" }
southstar-js-perf = { path = "../js-perf" }
southstar-js-realm = { path = "../js-realm" }
southstar-js-reflect = { path = "../js-reflect" }
southstar-js-services = { path = "../js-services" }
southstar-js-shadow = { path = "../js-shadow" }
southstar-js-storage = { path = "../js-storage" }
southstar-js-temporal = { path = "../js-temporal" }
southstar-js-text = { path = "../js-text" }
southstar-js-top-layer = { path = "../js-top-layer" }
southstar-js-traversal = { path = "../js-traversal" }
southstar-js-url = { path = "../js-url" }
southstar-js-wasm = { path = "../js-wasm", optional = true }
southstar-js-window = { path = "../js-window" }
southstar-js-workers = { path = "../js-workers" }
southstar-layout = { path = "../layout" }
southstar-i18n = { path = "../i18n" }
southstar-image = { path = "../image" }
southstar-mat4 = { path = "../mat4" }
southstar-mathml = { path = "../mathml" }
southstar-mic = { path = "../mic" }
southstar-net = { path = "../net" }
southstar-netutil = { path = "../netutil" }
southstar-paint = { path = "../paint" }
southstar-pdf = { path = "../pdf" }
southstar-print = { path = "../print" }
southstar-render = { path = "../render" }
southstar-renderer-client = { path = "../renderer-client" }
southstar-renderer-host = { path = "../renderer-host" }
southstar-safebrowsing = { path = "../safebrowsing" }
southstar-selection = { path = "../selection" }
southstar-sandbox = { path = "../sandbox" }
southstar-spellcheck = { path = "../spellcheck" }
southstar-svg = { path = "../svg" }
southstar-threaddump = { path = "../threaddump" }
southstar-webcrypto = { path = "../webcrypto" }
southstar-webgl = { path = "../webgl" }
southstar-texture = { path = "../texture" }
southstar-watchdog = { path = "../watchdog" }
southstar-engine = { path = "../engine" }
southstar-headless = { path = "../headless" }
southstar-idb = { path = "../idb" }
southstar-webaudio = { path = "../webaudio" }
southstar-websocket = { path = "../websocket" }
southstar-woff2 = { path = "../woff2", optional = true }
southstar-xml = { path = "../xml" }

[features]
avif = ["southstar-image/avif", "southstar-net/avif"]
sdl = ["southstar-mic/sdl", "southstar-renderer-host/sdl"]
fontconfig = ["southstar-renderer-host/fontconfig"]
font-fontconfig = ["southstar-font/fontconfig"]
freetype = ["southstar-font/freetype"]
pangoft2 = ["southstar-font/pangofc"]
poppler = ["southstar-pdf/poppler", "southstar-net/poppler"]
egl = ["southstar-glctx/egl"]
ns-pango = [
    "southstar-canvas/ns-pango",
    "southstar-font/ns-pango",
    "southstar-js-intl/ns-pango",
    "southstar-mathml/ns-pango",
    "southstar-svg/ns-pango",
    "southstar-net/ns-pango",
    "southstar-paint/ns-pango",
]
enchant = ["southstar-net/enchant", "southstar-spellcheck/enchant"]
http-brotli = ["southstar-net/http-brotli"]
http-zstd = ["southstar-net/http-zstd"]
libav = ["southstar-headless/libav", "southstar-net/libav"]
seccomp = ["southstar-net/seccomp", "southstar-sandbox/seccomp"]
wasm = ["dep:southstar-js-wasm"]
webgpu = ["southstar-canvas/webgpu", "southstar-net/webgpu"]
woff2 = ["dep:southstar-woff2", "southstar-font/woff2"]

[lints]
workspace = true
