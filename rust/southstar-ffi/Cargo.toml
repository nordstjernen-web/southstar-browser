[features]
avif = ["southstar-css/avif", "southstar-image/avif", "southstar-image-decoders/avif", "southstar-net/avif"]
sdl = ["southstar-mic/sdl", "southstar-renderer-host/sdl"]
fontconfig = ["southstar-renderer-host/fontconfig"]
font-fontconfig = ["southstar-font/fontconfig"]
poppler = ["southstar-pdf/poppler", "southstar-net/poppler"]
egl = ["southstar-glctx/egl"]
thai = ["southstar-text/thai"]
rust-shaper = ["southstar-text/rust-shaper"]
enchant = ["southstar-net/enchant", "southstar-spellcheck/enchant"]
http-brotli = ["southstar-net/http-brotli"]
http-zstd = ["southstar-net/http-zstd"]
libav = [
    "southstar-headless/libav",
    "southstar-js-runtime/libav",
    "southstar-net/libav",
    "southstar-video/libav",
]
audio-native-vorbis = ["southstar-js-runtime/audio-native-vorbis"]
audio-native-opus = ["southstar-js-runtime/audio-native-opus"]
seccomp = ["southstar-net/seccomp", "southstar-sandbox/seccomp"]
wasm = ["dep:southstar-js-wasm", "southstar-js-runtime/wasm", "southstar-net/wasm"]
webgpu = ["dep:southstar-webgpu", "southstar-canvas/webgpu", "southstar-js-page/webgpu", "southstar-js-runtime/webgpu", "southstar-net/webgpu"]
woff2 = ["dep:southstar-woff2", "southstar-font/woff2", "southstar-net/woff2"]

[lints]
workspace = true
