[package]
name = "southstar-js-workers"
description = "MessagePort, MessageChannel and BroadcastChannel, and the dedicated and service workers that carry messages between runtimes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-glib = { path = "../glib" }
southstar-js-bind = { path = "../js-bind", default-features = false }
southstar-js-clone = { path = "../js-clone", default-features = false }
southstar-js-engine = { path = "../js-engine", default-features = false }

[features]
default = ["quickjs"]
quickjs = [
    "southstar-js-engine/quickjs",
    "southstar-js-bind/quickjs",
    "southstar-js-clone/quickjs",
]
boa = [
    "southstar-js-engine/boa",
    "southstar-js-bind/boa",
    "southstar-js-clone/boa",
]

[lints]
workspace = true
