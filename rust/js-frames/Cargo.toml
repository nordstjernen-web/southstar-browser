[package]
name = "southstar-js-frames"
description = "Iframe browsing contexts: the frame realm cloner, frame realm and scope bootstraps, the frame table, sandbox flags, the frame owner element bindings, frame load scheduling and the frame script helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
southstar-config = { path = "../config" }
southstar-css = { path = "../css" }
southstar-csp = { path = "../csp" }
southstar-dom = { path = "../dom" }
southstar-glib = { path = "../glib" }
southstar-html-parser = { path = "../html-parser" }
southstar-html-util = { path = "../html-util" }
southstar-js-loader = { path = "../js-loader" }
southstar-xml = { path = "../xml" }
southstar-js-bind = { path = "../js-bind", default-features = false }
southstar-js-custom-elements = { path = "../js-custom-elements" }
southstar-js-engine = { path = "../js-engine", default-features = false }
southstar-js-mutation = { path = "../js-mutation" }
southstar-js-perf = { path = "../js-perf" }
southstar-js-runtime = { path = "../js-runtime", default-features = false }
southstar-layout = { path = "../layout" }
southstar-url = { path = "../url" }

[lints]
workspace = true
