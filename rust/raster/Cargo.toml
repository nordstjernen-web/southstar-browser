[package]
name = "southstar-raster"
description = "PNG/APNG, GIF, JPEG and BMP decoding in safe Rust to premultiplied BGRA canvases, still and animated"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gif = { version = "0.14", default-features = false, features = ["std"] }
png = { version = "0.18", default-features = false }
zune-jpeg = { version = "0.5", default-features = false, features = ["std", "x86", "neon"] }

[lints]
workspace = true
