exclude = ["third_party"]

[workspace.package]
version = "1.0.11"
edition = "2024"
rust-version = "1.100"
license = "LicenseRef-NSL-1.0 OR GPL-3.0-or-later"
publish = false
repository = "https://github.com/nordstjernen-web/southstar-browser"
homepage = "https://nordstjernen.org"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
ptr_as_ptr = "deny"
transmute_ptr_to_ptr = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
panic = "abort"

