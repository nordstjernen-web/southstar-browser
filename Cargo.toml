[workspace]
resolver = "3"
members = ["rust/*"]
exclude = ["third_party"]

[workspace.package]
version = "0.9.11-dev"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-NSL-1.0 OR GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
missing_safety_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
panic = "abort"
overflow-checks = false

[patch.crates-io]
boa_engine = { path = "third_party/boa_engine" }
