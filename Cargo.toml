[workspace]
resolver = "3"
members = ["rust/*"]
exclude = ["third_party"]

[workspace.package]
version = "0.9.12-dev"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-NSL-1.0 OR GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
ptr_as_ptr = "deny"
transmute_ptr_to_ptr = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
panic = "abort"

[patch.crates-io]
boa_ast = { path = "third_party/boa_ast" }
boa_engine = { path = "third_party/boa_engine" }
boa_parser = { path = "third_party/boa_parser" }
boa_gc = { path = "third_party/boa_gc" }
