name: linux

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ github.event_name == 'workflow_dispatch' && 'release build' || 'debug build' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    env:
      DEBIAN_FRONTEND: noninteractive
      FULL: ${{ github.event_name == 'workflow_dispatch' }}
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc pkg-config \
            libgtk-4-dev libepoxy-dev libssl-dev zlib1g-dev libbrotli-dev libzstd-dev \
            libuchardet-dev libsqlite3-dev \
            libharfbuzz-dev libfontconfig-dev libfreetype-dev \
            libwebp-dev libavif-dev libsdl2-dev libseccomp-dev ca-certificates \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev

      - name: Install Rust
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal
          rustc --version
          cargo --version

      - name: Restore the cargo build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-build-${{ env.FULL }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-build-${{ env.FULL }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            cargo-build-${{ env.FULL }}-${{ runner.os }}-

      - name: Show toolchain versions
        run: |
          gcc --version | head -1
          pkg-config --modversion gtk4
          pkg-config --modversion libavcodec

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if [ "$FULL" = true ]; then
            cargo xtask build --overflow-checks 2>&1 | tee build.log
          else
            cargo xtask build --debug 2>&1 | tee build.log
          fi

      - name: Save the cargo build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-build-${{ env.FULL }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
