name: linux

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: fmt, clippy, tests, deny, vet
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 100

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ pkg-config \
            libgtk-4-dev libepoxy-dev libssl-dev zlib1g-dev libbrotli-dev libzstd-dev \
            libuchardet-dev libpsl-dev libsqlite3-dev \
            libwebp-dev libavif-dev libsdl2-dev libseccomp-dev ca-certificates \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev

      - name: Install Rust
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal --component clippy,rustfmt
          rustc --version
          cargo --version

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy and the per-crate unsafe budget
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          baseline=()
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ] \
              && git fetch --no-tags --depth=100 origin "$BASE_SHA"; then
            baseline=(--baseline "$BASE_SHA")
          fi
          python3 scripts/unsafe-budget.py --clippy "${baseline[@]}" --summary "$GITHUB_STEP_SUMMARY"

      - name: cargo test
        run: ./scripts/rust-tests.sh

      - name: Restore cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}

      - name: Install cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny@0.20.2

      - name: cargo deny
        run: cargo deny --locked check --hide-inclusion-graph

      - name: Restore cargo-vet
        id: cargo-vet-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-vet
          key: cargo-vet-0.10.2-${{ runner.os }}

      - name: Install cargo-vet
        if: steps.cargo-vet-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-vet@0.10.2

      - name: cargo vet
        run: cargo vet --locked

  build:
    name: ${{ github.event_name == 'workflow_dispatch' && 'release build, smoke and WPT' || 'debug build and smoke' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    env:
      DEBIAN_FRONTEND: noninteractive
      FULL: ${{ github.event_name == 'workflow_dispatch' }}
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache gcc g++ make cmake pkg-config meson ninja-build \
            libgtk-4-dev libepoxy-dev libssl-dev zlib1g-dev libbrotli-dev libzstd-dev \
            libuchardet-dev libpsl-dev libsqlite3-dev \
            libwebp-dev libavif-dev libsdl2-dev libseccomp-dev ca-certificates \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev

      - name: Install Rust
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal
          rustc --version
          cargo --version

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-linux-gcc-${{ env.FULL }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-gcc-${{ env.FULL }}-

      - name: Configure ccache
        run: |
          ccache --max-size=200M
          ccache --zero-stats
          echo "CC=ccache gcc"  >> $GITHUB_ENV
          echo "CXX=ccache g++" >> $GITHUB_ENV

      - name: Show toolchain versions
        run: |
          gcc --version | head -1
          meson --version
          ninja --version
          pkg-config --modversion gtk4
          pkg-config --modversion libavcodec

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if [ "$FULL" = true ]; then
            meson setup builddir --werror -Doverflow_checks=true
          else
            meson setup builddir --werror -Dbuildtype=debug
          fi
          meson compile -C builddir 2>&1 | tee build.log

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Smoke test (binary present and executable)
        run: |
          test -x builddir/src/gtk/southstar
          file builddir/src/gtk/southstar
          ldd builddir/src/gtk/southstar | head -20

      - name: Headless smoke (about:start + <video> layout)
        run: |
          set -o pipefail
          ./builddir/src/gtk/southstar --headless --dump=text about:start > about.txt
          head -3 about.txt
          grep -q Southstar about.txt
          mkdir -p smoke
          cat > smoke/video.html <<'EOF'
          <!doctype html><video src="x.webm" width="320" height="180"></video>
          EOF
          (cd smoke && python3 -m http.server 18765 >/dev/null 2>&1 &) ; sleep 1
          ./builddir/src/gtk/southstar --headless --dump=layout \
              http://127.0.0.1:18765/video.html \
              | tee /tmp/layout.txt
          grep -q 'video @' /tmp/layout.txt
          pkill -f "http.server 18765" || true

      - name: Headless baseline smoke (./scripts/dev.sh smoke)
        run: ./scripts/dev.sh smoke

      - name: Fetch web-platform-tests
        id: wpt-fetch
        if: env.FULL == 'true'
        continue-on-error: true
        env:
          WPT_REV: ac7ff49df82aaf9630eeabb1f0f562279527cf10
        run: |
          git init -q "$RUNNER_TEMP/wpt"
          cd "$RUNNER_TEMP/wpt"
          git remote add origin https://github.com/web-platform-tests/wpt
          git sparse-checkout set --no-cone '/*' '!/*/' /tools/ /resources/ /common/ \
            /docs/commands.json /interfaces/ /fonts/ /images/ /media/ \
            /fullscreen/trusted-click.js /trusted-types/support/ \
            /visual-viewport/viewport_support.js \
            /dom/ /url/ /console/ /hr-time/ /html/ /WebCryptoAPI/ /xhr/ /domparsing/
          git fetch -q --depth 1 --filter=blob:none origin "$WPT_REV"
          git checkout -q FETCH_HEAD
          ./wpt make-hosts-file | sudo tee -a /etc/hosts > /dev/null

      - name: Web platform tests (the slice tracked in docs/wpt-scores.md)
        if: steps.wpt-fetch.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          scripts/wpt-score.sh --wpt-root="$RUNNER_TEMP/wpt" --jobs=4 \
              --summary="$GITHUB_STEP_SUMMARY"
          mkdir -p wpt-results
          cp docs/wpt-runs/*-"$(git rev-parse --short HEAD)".tsv docs/wpt-subtests.tsv wpt-results/

      - name: Upload WPT results
        if: hashFiles('wpt-results/*.tsv') != ''
        uses: actions/upload-artifact@v7
        with:
          name: wpt-results
          path: wpt-results/
          retention-days: 30

      - name: Upload build log
        if: always() && hashFiles('build.log') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload southstar binary
        if: env.FULL == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: southstar-linux
          path: builddir/src/gtk/southstar
          if-no-files-found: error
          retention-days: 14
