name: fuzz

# Runs every cargo-fuzz target under AddressSanitizer: one minute each on a
# push or pull request that touches Rust, twenty minutes each every night. The
# corpora persist between runs in the Actions cache, so coverage accumulates.
on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'fuzz/**'
      - 'Cargo.lock'
      - '.github/workflows/fuzz.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rust/**'
      - 'fuzz/**'
      - 'Cargo.lock'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds to run each target'
        required: false
        default: '300'

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && '1200' || inputs.seconds || '60' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the libraries the targets link
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libglib2.0-dev zlib1g-dev

      - name: Install nightly Rust and cargo-fuzz
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install nightly --profile minimal
          cargo +nightly install --locked cargo-fuzz@0.13.2

      - name: Restore corpora
        uses: actions/cache@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Build the targets
        run: cargo +nightly fuzz build

      - name: Run each target
        shell: bash
        run: |
          failed=()
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            if ! cargo +nightly fuzz run "$target" -- \
                -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 -timeout=10; then
              failed+=("$target")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Crashing targets: ${failed[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
