name: musl

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    container: alpine:3.24
    timeout-minutes: 40
    steps:
      - name: Install build dependencies (musl)
        run: |
          apk add --no-cache \
            build-base clang ccache pkgconf meson ninja git cmake \
            gtk4.0-dev libepoxy-dev openssl-dev zlib-dev brotli-dev zstd-dev uchardet-dev libpsl-dev sqlite-dev libwebp-dev libavif-dev sdl2-dev \
            libseccomp-dev ffmpeg-dev curl llvm-libunwind-dev \
            fontconfig font-dejavu ca-certificates file nodejs

      - uses: actions/checkout@v7

      # Alpine's rust package lags behind the toolchain the build pins in
      # rust-toolchain.toml, so install that with rustup.
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal --component clippy,rustfmt
          rustc --version
          cargo --version

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: /root/.cache/ccache
          key: ccache-musl-${{ github.sha }}
          restore-keys: |
            ccache-musl-

      - name: Configure ccache
        run: |
          ccache --max-size=200M
          ccache --zero-stats

      - name: Build (musl libc)
        env:
          RUSTFLAGS: -C target-feature=-crt-static
        run: |
          export CC="ccache clang"
          meson setup builddir
          meson compile -C builddir
          file builddir/src/gtk/southstar

      - name: ccache stats
        if: always()
        run: command -v ccache >/dev/null && ccache --show-stats || true

      - name: Headless smoke test (musl, no X server needed)
        env:
          NS_ALLOW_ROOT: '1'
        run: |
          ldd builddir/src/gtk/southstar | grep -i musl || true
          ./builddir/src/gtk/southstar \
            --headless --url=https://example.com --dump=text > smoke.txt
          head -40 smoke.txt
          grep -qi example smoke.txt
