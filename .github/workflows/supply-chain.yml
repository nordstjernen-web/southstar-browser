name: supply-chain

# cargo-deny checks every push and pull request against deny.toml: RustSec
# advisories, licences compatible with NSL-1.0 OR GPL-3.0-or-later, banned
# crates (upstream engine code, libcurl) and crates.io as the only source.
# cargo-audit reruns the advisory check every night, so an advisory published
# against an unchanged Cargo.lock still turns the run red.
on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/supply-chain.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/supply-chain.yml'
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust and cargo-deny
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          cargo install --locked cargo-deny@0.20.2

      - name: cargo deny check
        run: cargo deny --locked check --hide-inclusion-graph

  audit:
    name: cargo audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust and cargo-audit
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          cargo install --locked cargo-audit@0.22.2

      - name: cargo audit
        run: cargo audit --deny warnings
